# Five containers:
#   airflow-db        Postgres that stores Airflow's OWN metadata (DAG runs, task states)
#   warehouse         Postgres that stores OUR cleaned data (the "database" in the assignment)
#   airflow-init      one-off: creates Airflow's tables + an admin login, then exits
#   airflow-webserver the UI at http://localhost:8080
#   airflow-scheduler decides what runs when and launches tasks (LocalExecutor = parallel processes)

x-airflow-common: &airflow-common
  build: .
  image: week11-airflow:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor          # runs independent tasks in parallel
    AIRFLOW__CORE__PARALLELISM: 8
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: week11-local-dev-secret
    # Connection used by the DAG (conn_id = warehouse_db)
    AIRFLOW_CONN_WAREHOUSE_DB: postgresql://mortality:mortality@warehouse:5432/mortality
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./output:/opt/airflow/output
    - ./agents/automl-research-lab/datasets:/opt/airflow/agent_datasets   # Part 2 hand-off
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: mortality
      POSTGRES_PASSWORD: mortality
      POSTGRES_DB: mortality
    ports:
      - "5433:5432"   # connect from your laptop on port 5433 (e.g. DBeaver / psql)
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mortality"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin
               --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-data:
  warehouse-data:
  airflow-logs:
